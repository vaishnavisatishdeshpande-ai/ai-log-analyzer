spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  cache:
    type: simple
    cache-names:
      - severityCache

  aop:
    proxy-target-class: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,env
  endpoint:
    health:
      show-details: always

severity:
  rules:
    - level: CRITICAL
      patterns: ["outofmemory", "crash", "fatal", "panic", "exception in thread"]
      confidence: 0.95
    - level: HIGH
      patterns: ["timeout", "connection refused", "socket timeout", "database error", "authentication failed"]
      confidence: 0.85
    - level: MEDIUM
      patterns: ["warning", "deprecated", "null", "error"]
      confidence: 0.70
    - level: LOW
      patterns: []
      confidence: 0.50

resilience4j:
  ratelimiter:
    instances:
      aiAnalysisLimiter:
        limitForPeriod: 30
        limitRefreshPeriod: 1m
        timeoutDuration: 5s

  circuitbreaker:
    instances:
      aiAnalysisCircuitBreaker:
        failureRateThreshold: 50
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 10